<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Job Application Tracker{% endblock %}</title>
  <!-- Bootstrap 5 CSS from CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Our own styles -->
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <!-- Navbar with a link to each page -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand" href="{{ url_for('dashboard') }}">Job Tracker</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="nav">
        <ul class="navbar-nav">
          <li class="nav-item"><a class="nav-link" href="{{ url_for('dashboard') }}">Dashboard</a></li>
          <li class="nav-item"><a class="nav-link" href="{{ url_for('companies') }}">Companies</a></li>
          <li class="nav-item"><a class="nav-link" href="{{ url_for('jobs') }}">Jobs</a></li>
          <li class="nav-item"><a class="nav-link" href="{{ url_for('applications') }}">Applications</a></li>
          <li class="nav-item"><a class="nav-link" href="{{ url_for('contacts') }}">Contacts</a></li>
          <li class="nav-item"><a class="nav-link" href="{{ url_for('job_match') }}">Job Match</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container mt-4">
    <!-- Flash messages (set in Python with flash("text", "success")) -->
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="alert alert-{{ category }}">{{ message }}</div>
      {% endfor %}
    {% endwith %}

    <!-- Each page fills this block with its own content -->
    {% block content %}{% endblock %}
  </main>

  <!-- Bootstrap JS (needed for the collapsing navbar) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
